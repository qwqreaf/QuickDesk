name: QuickDesk macOS

on:
  push:
    paths:
      - 'QuickDesk/**'
      - 'quickdesk-mcp/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'WebClient/**'
      - 'CMakeLists.txt'
      - '.github/workflows/quickdesk-macos.yml'
  pull_request:
    paths:
      - 'QuickDesk/**'
      - 'quickdesk-mcp/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'WebClient/**'
      - 'CMakeLists.txt'
      - '.github/workflows/quickdesk-macos.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish the Apple Silicon DMG after a successful build (e.g. v4.2.0.1); empty builds artifacts only'
        required: false
        type: string

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      QT_VERSION: '6.8.3'
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: 'qtmultimedia qtwebsockets'

      - name: Set Qt path
        run: echo "ENV_QT_PATH=$(dirname "$QT_ROOT_DIR")" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'x64' && 'x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            quickdesk-mcp/target
            quickdesk-skill-host/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('quickdesk-mcp/Cargo.lock', 'quickdesk-skill-host/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Build
        env:
          ENV_QUICKDESK_API_KEY: ${{ secrets.QUICKDESK_API_KEY }}
        run: bash scripts/build_qd_mac.sh Release ${{ matrix.arch }}

      - name: Build MCP Bridge
        run: bash scripts/build_mcp_mac.sh Release ${{ matrix.arch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release MCP bridge
        env:
          QUICKDESK_MCP_BINARY: ${{ github.workspace }}/output/${{ matrix.arch }}/Release/quickdesk-mcp
        run: |
          python -m pip install 'websockets>=14,<17'
          python quickdesk-mcp/tests/test_protocol.py

      - name: Build Skill Host
        run: bash scripts/build_skill_host_mac.sh Release ${{ matrix.arch }}

      - name: Build WebClient
        run: bash scripts/build_webclient_mac.sh

      - name: Publish
        run: bash scripts/publish_qd_mac.sh Release ${{ matrix.arch }}

      - name: Verify app bundle and architecture
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app=publish/Release/QuickDesk.app
          arch="$PACKAGE_ARCH"
          if [ "$arch" = x64 ]; then arch=x86_64; fi
          test -d "$app/Contents/Frameworks/quickdesk_host.app"
          host_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Frameworks/quickdesk_host.app/Contents/Info.plist")
          lipo "$app/Contents/Frameworks/quickdesk_host.app/Contents/MacOS/$host_executable" -verify_arch "$arch"
          for binary in "$app/Contents/MacOS/QuickDesk" \
            "$app/Contents/Frameworks/quickdesk_client" \
            "$app/Contents/Frameworks/quickdesk-mcp" \
            "$app/Contents/Frameworks/quickdesk-skill-host"; do
            test -x "$binary"
            lipo "$binary" -verify_arch "$arch"
          done
          for skill in sys-info file-ops shell-runner; do
            test -f "$app/Contents/Resources/skills/$skill/SKILL.md"
            lipo "$app/Contents/Resources/skills/$skill/$skill" -verify_arch "$arch"
          done
          test -s "$app/Contents/Resources/icudtl.dat"
          codesign --verify --deep --strict "$app"

      - name: Package DMG
        run: bash scripts/package_qd_mac.sh Release

      - name: Get version
        id: version
        run: |
          echo "version=$(cat version)" >> $GITHUB_OUTPUT
          echo "ref-name=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Name and verify DMG
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          hdiutil verify publish/Release/QuickDesk.dmg
          mv publish/Release/QuickDesk.dmg "publish/Release/QuickDesk-mac-${PACKAGE_ARCH}-${PACKAGE_VERSION}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickDesk-mac-${{ matrix.arch }}-${{ steps.version.outputs.ref-name }}
          path: publish/Release/QuickDesk-mac-*.dmg
          if-no-files-found: error

  release:
    name: Publish macOS release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: QuickDesk-mac-*
          path: dist
          merge-multiple: true
      - name: Publish verified Apple Silicon package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(cat version)
          test "$RELEASE_TAG" = "v$version"
          test -s "dist/QuickDesk-mac-arm64-${version}.dmg"
          (cd dist && sha256sum *.dmg > SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/*.dmg dist/SHA256SUMS \
            --repo "$RELEASE_REPO" --target "$RELEASE_SHA" \
            --title "QuickDesk $version (rmcp 3.x)" \
            --notes-file "docs/releases/$version.md" --latest
